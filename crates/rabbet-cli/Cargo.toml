[package]
name = "rabbet-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
description = "Command-line interface, ingestion daemon, and maintainer admin console for rabbet"

[[bin]]
name = "rabbet"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
rabbet-core = { path = "../rabbet-core", version = "0.1.0-beta.2" }
miter-engine = { path = "../../../miter/crates/engine", version = "0.1.0-alpha.3" }
dado-core = { path = "../../../dado/crates/dado-core", version = "0.1.0-beta.2" }
axum = { version = "0.8" }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "net"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.10"
