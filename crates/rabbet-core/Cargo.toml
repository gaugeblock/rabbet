[package]
name = "rabbet-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core domain types, SQLite master store, Parquet exporter, and miners for rabbet"

[dependencies]
miter-engine = { path = "../../../miter/crates/engine", version = "0.1.0-alpha.2" }
dado-core = { path = "../../../dado/crates/dado-core", version = "0.1.0-beta.1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
sha2 = "0.10"
rusqlite = { version = "0.40", features = ["bundled"] }
arrow = { version = "60.0", default-features = false, features = ["ipc"] }
parquet = { version = "60.0", default-features = false, features = ["arrow", "snap"] }
tokio = { version = "1.43", features = ["sync", "fs", "io-util", "rt-multi-thread"] }
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
async-trait = "0.1"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.12"
tokio = { version = "1.43", features = ["macros"] }

[lints]
workspace = true
